name: publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  sbom:
    name: sbom
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    permissions:
      contents: read
    with:
      mode: release
      ecosystem: python

  attest:
    name: attest
    needs: sbom
    uses: cyberwitchery/.github/.github/workflows/attest.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      names: ${{ needs.sbom.outputs.names }}

  # publishes the wheel and sdist the sbom job built and attested.
  publish:
    needs: sbom
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: download release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: evidence
      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: evidence/release/*.cdx.json
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: evidence/packages/familiar-cli/
